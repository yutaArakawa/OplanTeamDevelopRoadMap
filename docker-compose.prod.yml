services:
  web:
    build: .
    command: bash /app/entrypoint.sh
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "9149:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DATABASES_NAME}
      MYSQL_USER: ${DATABASES_USER}
      MYSQL_PASSWORD: ${DATABASES_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  cron:
    build: .
    command: cron -f
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - TZ=Asia/Tokyo

volumes:
  mysql_data: