version: 2.1

jobs:
    build:
        docker:
            - image: cimg/python:3.11

        steps:
            - checkout

            - run:
              name: Install dependencies
              command: |
                pip install -r requirements.txt

            - run:
              name: Run migrations
              command: |
                python manage.py migrate
            
            - run:
              name: Run tests
              command: |
                python manage/py test

workflows:
    version: 2
    test:
        jobs:
          - build

