{% extends 'base.html' %}

{% block title %}
倉庫管理
{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">倉庫管理</h1>
    </div>
    <div class="ms-auto">
        <a href="{% url 'warehouse_create' %}" class="btn btn-primary">
            新規倉庫追加
        </a>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 align-items-end">
            <div class="col-md-6">
                <label for="address" class="form-label">住所</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    class="form-control"
                    value="{{ selected_address }}"
                    placeholder="都道府県、市区町村、番地で検索"
                >
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">絞り込む</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table align-middle mb-0">
            <thead>
                <tr>
                    <th>倉庫名</th>
                    <th>倉庫住所</th>
                    <th class="text-end">編集</th>
                </tr>
            </thead>
            <tbody>
                {% for warehouse in warehouse_list %}
                <tr>
                    <td>{{ warehouse.warehouse_name }}</td>
                    <td>{{ warehouse.get_full_address }}</td>
                    <td class="text-end">
                        <a href="{% url 'warehouse_edit' warehouse.id %}" class="btn btn-sm btn-outline-primary">
                            編集
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                        登録済みの倉庫はありません
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
