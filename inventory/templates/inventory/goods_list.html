{% extends 'base.html' %}

{% block title %}
商品管理
{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">商品管理</h1>
    </div>
    <div class="ms-auto d-flex gap-2">
        <a href="{% url 'goods_category_list' %}" class="btn btn-primary">
            カテゴリ管理
        </a>
        <a href="{% url 'goods_create' %}" class="btn btn-primary">
            新規商品作成
        </a>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="category" class="form-label">カテゴリ</label>
                <select id="category" name="category" class="form-select">
                    <option value="">すべて</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}" {% if selected_category == category.id|stringformat:'s' %}selected{% endif %}>
                        {{ category.category_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">絞り込む</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table align-middle mb-0">
            <thead>
                <tr>
                    <th>商品名</th>
                    <th>カテゴリ</th>
                    <th class="text-end">編集</th>
                </tr>
            </thead>
            <tbody>
                {% for goods in goods_list %}
                <tr>
                    <td>{{ goods.goods_name }}</td>
                    <td>{{ goods.goods_category }}</td>
                    <td class="text-end">
                        <a href="{% url 'goods_edit' goods.id %}" class="btn btn-sm btn-outline-primary">
                            編集
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                        登録済みの商品はありません
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
