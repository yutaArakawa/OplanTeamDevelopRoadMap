services:
  web:
    build: .
    command: bash /app/entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: stockdb
      MYSQL_USER: stockuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  cron:
    build: .
    command: cron -f
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - TZ=Asia/Tokyo

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://web:8000
      - VITE_API_BASE=/api
      - VITE_APP_NAME=Stock Management System
      - TZ=Asia/Tokyo
    depends_on:
      - web
    stdin_open: true
    tty: true

volumes:
  mysql_data: