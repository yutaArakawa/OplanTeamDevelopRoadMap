{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>
            {% block title %}
            {% endblock %}
        </title>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
        <link rel="stylesheet" href="{% static 'common/css/common.css' %}">
        <!--　ページ固有のCSS差込 -->
        {% block extra_css %}{% endblock %}
    </head>
    <body>
        {% include 'components/header.html' %}
        <div class="container mt-4">
            {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} mb-2" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // @ts-nocheck
            const AUTHORITY_ADMIN = {{ AUTHORITY_ADMIN }};
            const AUTHORITY_SHOP = {{ AUTHORITY_SHOP }};
            const AUTHORITY_WAREHOUSE = {{ AUTHORITY_WAREHOUSE }};
        </script>
        <script src="{% static 'common/js/common.js' %}"></script>
        <script src="{% static 'common/js/sidebar.js' %}"></script>
    </body>
</html>
